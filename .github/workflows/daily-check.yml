name: Auto publish key votes

on:
  schedule:
    - cron: "30 6 */3 * *"
  workflow_dispatch:

concurrency:
  group: lescrutin-auto-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUBLIC_BASE_URL: https://brnjean.github.io/lescrutin
      PUBLISH_IMAGE_BASE_URL: https://raw.githubusercontent.com/brnjean/lescrutin/main/public
      AUTO_PUBLISH_SINCE_DATE: "2026-07-28"
      META_GRAPH_HOST: graph.instagram.com
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Prepare next post
        id: prepare
        run: PYTHONPATH=src python auto_publish.py

      - name: Upload generated card
        if: steps.prepare.outputs.has_post == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vote-cards
          path: outputs/*.png

      - name: Commit public image
        if: steps.prepare.outputs.has_post == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          git commit -m "Stage scrutin ${{ steps.prepare.outputs.numero }}" || exit 0
          git push

      - name: Publish to Instagram
        if: steps.prepare.outputs.has_post == 'true'
        run: |
          test -n "$META_IG_USER_ID"
          test -n "$META_ACCESS_TOKEN"
          PYTHONPATH=src python publish_instagram.py \
            --draft "${{ steps.prepare.outputs.draft_path }}" \
            --image-url "${{ steps.prepare.outputs.image_url }}"

      - name: Commit published state
        if: steps.prepare.outputs.has_post == 'true'
        run: |
          git add published.json
          git commit -m "Mark scrutin ${{ steps.prepare.outputs.numero }} published" || exit 0
          git push
